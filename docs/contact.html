<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact · Axiologic Research</title>
    <meta name="description" content="Contact Axiologic Research about technical collaboration, AI research, validation and advanced software projects.">
    <link rel="canonical" href="https://www.axiologic.net/contact.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="./assets/css/site.css?v=20261005-1">
    <script defer src="https://cloud.umami.is/script.js" data-website-id="e252999d-4479-42d7-9526-5f778846d4f6"></script>
</head>
<body>
<main class="page services-page contact-page">
    <div class="shell">
        <div class="top-bar">
            <a class="logo-lockup" href="./index.html" aria-label="Axiologic Research home">
                <img src="./assets/images/logo.svg" alt="Axiologic Research" class="logo">
            </a>
        </div>

        <header class="services-hero">
            <div class="services-hero-copy">
                <span class="eyebrow">Axiologic Research · Contact</span>
                <h1>Let’s discuss the problem.</h1>
                <p>Tell us about the outcome, the difficult technical part and the constraints that matter. A short, concrete description is enough to start.</p>
            </div>
            <form class="panel contact-form" id="contact-form">
                <div class="contact-form-heading">
                    <span class="eyebrow">Project enquiry</span>
                    <h2>Start a conversation.</h2>
                </div>
                <div class="contact-form-row">
                    <label for="contact-name">Name</label>
                    <input id="contact-name" name="name" type="text" autocomplete="name" required>
                </div>
                <div class="contact-form-row">
                    <label for="contact-email">Work email</label>
                    <input id="contact-email" name="email" type="email" autocomplete="email" required>
                </div>
                <div class="contact-form-row">
                    <label for="contact-organization">Organization <span>optional</span></label>
                    <input id="contact-organization" name="organization" type="text" autocomplete="organization">
                </div>
                <div class="contact-form-row">
                    <label for="contact-project">What are you trying to build or solve?</label>
                    <textarea id="contact-project" name="project" rows="6" required></textarea>
                </div>
                <button class="btn primary contact-submit" type="submit">Submit enquiry <span aria-hidden="true">→</span></button>
            </form>
        </header>

        <footer class="footer">
            <span>© Axiologic Research</span>
            <img class="contact-email-image" src="./assets/images/contact-email.png" alt="Axiologic Research email address">
            <a class="legacy-link" href="./index.html">Back to Axiologic Research</a>
        </footer>
    </div>
</main>
<script src="./assets/js/newsletter.js"></script>
<script src="./assets/js/contact.js"></script>
</body>
</html>
